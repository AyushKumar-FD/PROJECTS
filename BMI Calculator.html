<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient( #f1f1f1, #917da5);
      }

      #bmicalculator {
        width: 400px;
        min-height: 480px;
        padding: 35px 30px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);

        display: flex;
        align-items: stretch;
        justify-content: center;
        flex-direction: column;
      }

      h3 {
        margin: 0 0 30px;
        text-align: center;
        font-size: 28px;
        color: #333;
      }

      label {
        margin-bottom: 30px;
        font-size: 15px;
        font-weight: bold;
        color: #444;
      }

      input[type="text"] {
        width: 100%;
        padding: 13px 15px;
        margin-bottom: 20px;
        border: 2px solid #ddd;
        border-radius: 10px;
        outline: none;
        font-size: 16px;
        transition: all 0.3s ease-in-out;
      }

      input[type="text"]:focus {
        border-color: #667eea;
        box-shadow: 0 0 8px rgba(102, 126, 234, 0.25);
      }

      input[type="reset"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border: none;
        border-radius: 10px;
        background: #f1f1f1;
        color: #444;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      input[type="reset"]:hover {
        background: #ddd;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(102, 126, 234, 0.35);
      }

      button:active {
        transform: translateY(0);
      }

      #bmiresult {
        margin: 25px 0 8px;
        text-align: center;
        font-size: 21px;
        font-weight: bold;
        color: #333;
      }

      #result {
        margin: 5px 0;
        padding: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        color: #667eea;
      }

      @media (max-width: 450px) {
        #bmicalculator {
          width: 90%;
          min-height: auto;
          padding: 30px 20px;
        }

        h3 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div id="bmicalculator">
      <h3>BMI Calculator</h3>

      <form action="">
        <label for="height">Height (cm):</label>
        <input type="text" id="height" placeholder="Enter Height" />

        <label for="Weight">Weight (kg):</label>
        <input type="text" id="Weight" placeholder="Enter Weight" />

        <input type="reset" value="Reset" />
      </form>

      <button onclick="calculatebmi()">Calculate BMI</button>

      <p id="bmiresult"></p>
      <p id="result"></p>
    </div>

    <script>
      let bmicalculator=document.querySelector("#bmicalculator");
      function calculatebmi() {
        let height = document.querySelector("#height").value;
        let Weight = document.querySelector("#Weight").value;

        if (Weight == "") {
          document.querySelector("#bmiresult").innerHTML = "PLZ Enter Weight";
          document.querySelector("#result").innerHTML="";
          return;
        } else if (height == "") {
          document.querySelector("#bmiresult").innerHTML = "PLZ Enter Height";
            document.querySelector("#result").innerHTML="";
          return;
        }

        height = height / 100;

        let bmi = Weight / (height * height);

        document.querySelector("#bmiresult").innerHTML =
          "Your BMI is: " + bmi.toFixed(2);
          
        let result = document.querySelector("#result");

        if (bmi < 18.5) {
          result.innerHTML = "UnderWeight";
          bmicalculator.style.transition="background-color 0.8s ease-in-out";
          bmicalculator.style.backgroundColor="rgba(135, 206, 235, 0.5)";
        } else if (bmi < 25) {
          result.innerHTML = "Normal Weight";
          bmicalculator.style.transition="background-color 0.8s ease-in-out";
          bmicalculator.style.backgroundColor="green";
        } else if (bmi < 30) {
          result.innerHTML = "OverWeight";
          bmicalculator.style.transition="background-color 0.8s ease-in-out";
          bmicalculator.style.backgroundColor="orange";
        } else {
          result.innerHTML = "Obesity";
          bmicalculator.style.transition="background-color 0.8s ease-in-out";
          bmicalculator.style.backgroundColor="rgba(255, 99, 71, 0.8)";
        }
      }
    </script>
  </body>
</html>
