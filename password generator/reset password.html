<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password Form</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #ff7643; /* इमेज का मुख्य ऑरेंज बैकग्राउंड */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* मुख्य Reset Password कार्ड */
        .reset-card {
            background: #ffffff;
            padding: 45px 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); /* पहले जैसी ही सॉफ्ट शैडो */
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        /* ऊपर का मेलबॉक्स आइकॉन */
        .icon-container {
            margin-bottom: 20px;
        }
        
        .icon-container svg {
            width: 100px;
            height: auto;
        }

        h3 {
            color: #2c2c2c;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #9e9e9e;
            font-size: 11px;
            margin-bottom: 35px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="password"] {
            width: 100%;
            height: 46px;
            border: 1px solid #dcdcdc;
            border-radius: 23px;
            padding: 0 45px 0 20px; /* राइट साइड में टिक मार्क के लिए जगह */
            font-size: 13px;
            color: #333333;
            outline: none;
            background: white;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            border: 1.5px solid #ff5d2a;
        }

        /* न्यू पासवर्ड इनपुट में दाईं ओर का ग्रीन टिक मार्क */
        .success-tick {
            position: absolute;
            right: 18px;
            color: #2e7d32;
            display: flex;
            align-items: center;
        }

        .success-tick svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* पासवर्ड स्ट्रेंथ इंडिकेटर (इमेज की 4 ग्रीन लाइन्स) */
        .strength-indicator {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        .bar {
            flex: 1;
            height: 4px;
            background-color: #4caf50; /* इमेज जैसा ग्रीन कलर */
            border-radius: 2px;
        }

        /* "Password strength: Excellent" टेक्स्ट */
        .strength-text {
            font-size: 11px;
            font-weight: 500;
            color: #9e9e9e;
            text-align: left;
            margin-bottom: 20px;
        }

        .strength-text span {
            color: #4caf50;
            font-weight: 600;
        }

        /* सेंड ईमेल बटन */
        .btn-submit {
            width: 100%;
            height: 46px;
            background-color: #ff5d2a;
            color: #ffffff;
            border: none;
            border-radius: 23px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: #e24919;
        }

        /* मोबाइल रेस्पॉन्सिव */
        @media (max-width: 500px) {
            .reset-card {
                width: 92%;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="reset-card
        <div class="icon-container">
            <svg viewBox="0 0 120 90" fill="none" xmlns="http://w3.org">
                <path d="M30 65H90V35C90 23.95 81.05 15 70 15H50C38.95 15 30 23.95 30 35V65Z" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M30 65L15 45V35L30 35" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M60 65V85" stroke="#333" stroke-width="2.5"/>
                <rect x="42" y="28" width="36" height="24" rx="2" stroke="#333" stroke-width="2" fill="white"/>
                <path d="M42 32L60 44L78 32" stroke="#333" stroke-width="2"/>
            </svg>
        </div>

        <h3>Reset password</h3>
        <p class="subtitle">Please kindly set your new password</p>

        <form id="resetForm">
        
            <div class="form-group">
                <label for="new-password">New password</label>
                <div class="input-wrapper">
                    <input type="password" id="new-password" required>
                
                    <div class="success-tick">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                </div>
                
            
                <div class="strength-indicator">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            
                <div class="strength-text">Password strength: <span>Excellent</span></div>
            </div>

        
            <div class="form-group">
                <label for="confirm-password">Re-enter password</label>
                <input type="password" id="confirm-password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Send Email</button>
        </form>
    </div>

    <script>
        const resetForm = document.querySelector("#resetForm");
        const newPass = document.querySelector("#new-password");
        const confirmPass = document.querySelector("#confirm-password");

        resetForm.addEventListener("submit", (e) => {
            e.preventDefault();
            if (newPass.value === confirmPass.value) {
                alert("Password reset successful!");
            } else {
                alert("Passwords do not match. Please try again.");
            }
        });
    </script>
</body>
</html>
