<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: #ff8056;
  color: #30313d;
}

#hero {
  width: 100%;
  min-height: 100vh;
  position: relative;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* Background shape */
#circle {
  position: absolute;
  width: 500px;
  height: 500px;
  background: rgba(237, 106, 59, 0.5);

  border-radius: 0 50% 50% 50%;

  top: -180px;
  left: 29%;
}

/* Main center card */
#forget {
  width: 600px;
  min-height: 560px;

  background: rgba(253, 241, 234, 0.88);

  border-radius: 20px;

  position: relative;
  z-index: 2;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 45px 50px;
}

/* Welcome heading */
#welc {
  width: 400px;
  text-align: center;
  margin-bottom: 25px;
}

#welc h3 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  color: #30313d;
}

#welc p {
  margin: 5px 0 0;
  font-size: 10px;
  color: #aaa;
}

/* Form */
#sign {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

form {
  width: 325px;

  display: flex;
  flex-direction: column;
}

form label {
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 6px;
  color: #070707;
}

form input {
  width: 100%;
  height: 33px;

  border: 1px solid #bfc1c8;
  border-radius: 18px;

  padding: 0 14px;
  margin-bottom: 14px;

  outline: none;

  font-family: "Poppins", sans-serif;
  font-size: 10px;

  background: white;

  transition: all  ease-in-out;
}

form input:focus {
  /* border-color: #ff5d2a; */
  border: 2px solid #ff5d2a;
}

/* Forgot password */
#forgetpassword {
  color: #ff0000;
  margin: -5px 0 18px;
  cursor: pointer;
}

/* Continue button */
#signin {
  width: 100%;
  height: 34px;

  border: none;
  border-radius: 18px;

  margin-top: 5px;
  background: #ff5d2a;
  color: white;

  font-family: "Poppins", sans-serif;
  font-size: 11px;

  cursor: pointer;
}

#forgetpassword {
  width: 100%;
  height: 34px;

  border: 1.5px solid black;
  border-radius: 18px;

  /* background: #ff5d2a; */
  

  font-family: "Poppins", sans-serif;
  font-size: 11px;

  margin-top: 20px;
  cursor: pointer;
  transition: all 1s ease-in-out;
}
#forgetpassword a{
  text-decoration: none;
color: rgb(2, 2, 2);
}
#forgetpassword:hover{
  background-color: #dddddd;
  /* border: none; */
}

#signin:hover {
  background: #f45120;
}

/* OR section */
#orsign {
  width: 325px;
  margin-top: 22px;
  text-align: center;
}

#orsign > p {
  color: #999;
  font-size: 9px;

  display: flex;
  align-items: center;
  gap: 12px;
}

#orsign > p::before,
#orsign > p::after {
  content: "";
  height: 1px;
  background: #d5d5d5;
  flex: 1;
}

/* Social buttons */
#buttons {
  display: flex;
  gap: 8px;
}

#buttons button {
  flex: 1;
  height: 25px;

  background: transparent;

  border: 1px solid #000000;
  border-radius: 14px;

  font-family: "Poppins", sans-serif;
  font-size: 10px;

  cursor: pointer;
}

#buttons button:hover  {
  background: white;
}

/* Responsive */
@media (max-width: 700px) {
  #forget {
    width: 90%;
    max-width: 600px;
    padding: 35px 20px;
  }

  #welc {
    width: 100%;
  }

  form,
  #orsign {
    width: 90%;
    max-width: 325px;
  }

  #circle {
    left: 5%;
  }
}

  </style>
  <body>
    <div id="hero">
      <div id="circle"></div>
      <div id="forget">
        <div id="welc">
          <h3>Welcome back</h3>
          <p>
            Enter your details to get sign in to your account
          </p>
        </div>
        <div id="sign">
          <form action="">
            <label for="Email">Email:</label>
            <input
              type="email"
              id="email"
              placeholder="e.g username@gmail.com"
            />
            <label for="Password">Password:</label>
            <input
              type="password"
              id="password"
              placeholder="enter your password"
            />
            <!-- <p id="forgetpassword" style="font-size: 0.5rem"></p> -->
            <button id="signin">Continue</button>
            <button id="forgetpassword"><a href="forgot password.html">Forgot Password</a></button>
          </form>
          <div id="orsign">
            <p>---- Or Sign in with ----</p>
            <div id="buttons">
              <button id="google">Google</button>
              <button id="apple">iPhone</button>
              <button id="facebook">facebook</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let pass="1234";
      let email=document.querySelector("#email");
      let password=document.querySelector("#password");
      let forgetpassword=document.querySelector("#forgetpassword")
      let signin=document.querySelector("#signin");

      signin.addEventListener("click",()=>{
         
        if(password.value==pass){
          alert("Login successful!");
        }
        else{
          alert("wrong Password");
          return;
        };
      })


    </script>
  </body>
</html>
