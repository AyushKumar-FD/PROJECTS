<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: #ff7643;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #hero {
        width: 100%;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #circle {
        position: absolute;
        width: 600px;
        height: 600px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        top: -200px;
        left: -100px;
        z-index: 1;
      }

      #forget {
        width: 500px;
        background: #fffcf9;
        border-radius: 30px;
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 50px 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      #welc {
        width: 100%;
        text-align: center;
        margin-bottom: 35px;
      }

      #welc h3 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        color: #2c2c2c;
      }

      #welc p {
        margin: 8px 0 0;
        font-size: 13px;
        color: #9e9e9e;
      }

      #sign {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      form {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
      }

      form label {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #2c2c2c;
      }

      form input {
        width: 100%;
        height: 46px;
        border: 1px solid #dcdcdc;
        border-radius: 23px;
        padding: 0 20px;
        margin-bottom: 20px;
        outline: none;
        font-family: "Poppins", sans-serif;
        font-size: 13px;
        background: white;
        transition: border-color 0.2s ease-in-out;
      }

      form input::placeholder {
        color: #c4c4c4;
      }

      form input:focus {
        border: 1.5px solid #ff5d2a;
      }

      .forgot-link-container {
        margin-top: -12px;
        margin-bottom: 25px;
        text-align: left;
      }

      .forgot-link-container a {
        color: #ff7643;
        font-size: 12px;
        text-decoration: none;
        font-weight: 500;
      }

      .forgot-link-container a:hover {
        text-decoration: underline;
      }

      #signin {
        width: 100%;
        height: 46px;
        border: none;
        border-radius: 23px;
        background: #ff5d2a;
        color: white;
        font-family: "Poppins", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease-in-out;
      }

      #signin:hover {
        background: #e24919;
      }

      #orsign {
        width: 100%;
        max-width: 380px;
        margin-top: 30px;
        text-align: center;
      }

      #orsign > p {
        color: #999;
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }

      #orsign > p::before,
      #orsign > p::after {
        content: "";
        height: 1px;
        background: #e0e0e0;
        flex: 1;
      }

      #buttons {
        display: flex;
        gap: 10px;
        width: 100%;
      }

      #buttons button {
        flex: 1;
        height: 38px;
        background: transparent;
        border: 1px solid #b5b5b5;
        border-radius: 19px;
        font-family: "Poppins", sans-serif;
        font-size: 12px;
        font-weight: 500;
        color: #333;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background-color 0.2s;
      }

      #buttons button:hover {
        background: #f5f5f5;
        border-color: #333;
      }

      #buttons img {
        width: 14px;
        height: 14px;
      }

      @media (max-width: 550px) {
        #forget {
          width: 92%;
          padding: 40px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <div id="circle"></div>
      <div id="forget">
        <div id="welc">
          <h3>Welcome back</h3>
          <p>Enter your details to get sign in to your account</p>
        </div>
        <div id="sign">
          <form id="loginForm" action="">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="e.g. username@kinety.com"
              required
            />

            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="enter your password"
              required
            />

            <div class="forgot-link-container">
              <a href="forgot password.html">Forgot Password?</a>
            </div>

            <button type="submit" id="signin">Continue</button>
          </form>

          <div id="orsign">
            <p>Or Sign in with</p>
            <div id="buttons">
              <button id="google">
                <img src="https://gstatic.com" alt="Google Logo" /> Google
              </button>
              <button id="apple">
                <svg
                  width="12"
                  height="14"
                  viewBox="0 0 170 170"
                  fill="currentColor"
                >
                  <path
                    d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.24-1.92-14.69-6.14-3.57-2.8-7.53-7.57-11.87-14.33C25.43 131.74 15.7 110.15 15.1 85.94c-.42-16.71 4.2-30.82 13.85-42.33 9.65-11.51 21.05-17.43 34.19-17.75 6.42-.12 12.82 1.83 19.18 5.85 6.36 4.02 10.99 5.85 13.88 5.49 2.12-.37 6.7-2.31 13.72-5.85 7.02-3.54 13.52-5.07 19.5-4.57 14.54 1.12 25.68 6.62 33.42 16.5-12.44 7.56-18.42 17.68-17.92 30.36.5 10.12 4.31 18.43 11.43 24.93 7.12 6.5 15.42 9.94 24.89 10.31-2.24 6.74-5.81 14.57-10.71 23.44zM119.22 30c0-7.37 2.62-14.2 7.86-20.5C132.32 3.19 139.1.1 147.22 0c.12 8.12-2.38 15.19-7.5 21.2-5.12 6-11.87 9.75-20.25 11.25-.13-.88-.25-1.63-.25-2.45z"
                  />
                </svg>
                Apple
              </button>
              <button id="facebook">
                <svg
                  width="12"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path
                    d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c4.56-.93 8-4.96 8-9.75z"
                  />
                </svg>
                Facebook
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let pass = "1234";
      let email = document.querySelector("#email");
      let password = document.querySelector("#password");
      let loginForm = document.querySelector("#loginForm");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        if (password.value === pass) {
          alert("Login successful!");
        } else {
          alert("Wrong Password");
        }
      });
    </script>
  </body>
</html>
