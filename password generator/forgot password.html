<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password Form</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f3ebe1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .forgot-password-card {
        background: #ffffff;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .icon-container {
        margin-bottom: 20px;
      }

      .icon-container svg {
        width: 80px;
        height: auto;
      }

      h2 {
        color: #1e1e1e;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 10px;
      }

      p {
        color: #8c8c8c;
        font-size: 13px;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .form-group {
        text-align: left;
        margin-bottom: 25px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333333;
        margin-bottom: 8px;
      }

      input[type="email"] {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #dcdcdc;
        border-radius: 12px;
        font-size: 14px;
        color: #333333;
        outline: none;
        transition: border-color 0.2s;
      }

      input[type="email"]::placeholder {
        color: #bfbfbf;
      }

      input[type="email"]:focus {
        border-color: #ff6229;
      }

      .btn-send {
        width: 100%;
        background-color: #ff6229;
        
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-bottom: 20px;
      }

      .btn-send a{
        text-decoration: none;
        color: #ffffff;
      }
      .btn-send:hover {
        background-color: #e2501b;
        transform: translateY(-5px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      .btn-send:focus{
        transform: scale(1);
      }

      .back-to-login {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #555555;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s;
      }

      .back-to-login:hover {
        color: #ff6229;
      }

      .back-to-login svg {
        margin-right: 6px;
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="forgot-password-card">
      <div class="icon-container">
        <svg viewBox="0 0 100 80" fill="none" xmlns="http://w3.org">
          <path
            d="M50 70V40M30 40H70V20H30V40Z"
            stroke="#333"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path d="M35 27H45" stroke="#333" stroke-width="2" />
          <path d="M25 45C25 45 28 42 33 45" stroke="#333" stroke-width="1.5" />
          <path d="M67 45C67 45 70 42 75 45" stroke="#333" stroke-width="1.5" />
        </svg>
      </div>

      <h2>Forgot your password?</h2>
      <p>Enter your email so that we can send you password reset link</p>

      <form>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="e.g. username@kinety.com"
            required
          />
        </div>

        <button type="submit" class="btn-send"><a href="reset password.html">Reset Password</a></button>
      </form>

      <a href="Password Generator.html" class="back-to-login">
        <svg viewBox="0 0 24 24">
          <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z" />
        </svg>
        Back to Login
      </a>
    </div>
  </body>
</html>
