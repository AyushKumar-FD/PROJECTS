<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      /* animation-name: grad;
      animation-iteration-count: infinite;
      animation-duration: 2s;
      animation-fill-mode: l;
      animation-direction: alternate-reverse;
      animation-timing-function: linear; */
    }

    /* @keyframes grad{
        0%{
            background: linear-gradient(135deg, #879dfc, #745594);
            background-position: 0% 50%;
        }
        50%{
            background: linear-gradient(135deg, #9dafff, #786091);
            background-position: 100% 50%;
        }
        100%{
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-position: 0% 50%;
        }
    } */

    /* Calculator Box */
    #cal {
      width: 320px;
      padding: 25px 20px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    /* Display */
    #calculator {
      width: 275px;
      height: 70px;
      padding: 10px 15px;

      border: none;
      outline: none;
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.85);
      color: #222;

      font-size: 2rem;
      font-weight: 600;
      text-align: right;

      box-shadow:
        inset 0 3px 8px rgba(0, 0, 0, 0.08),
        0 5px 15px rgba(0, 0, 0, 0.1);
    }

    /* Placeholder */
    #calculator::placeholder {
      color: #888;
      font-size: 0.9rem;
    }

    /* Table */
    table {
      border-spacing: 8px;
    }

    /* Buttons */
    button {
      width: 55px;
      height: 55px;

      border: none;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.85);
      color: #333;

      font-size: 1.1rem;
      font-weight: 600;

      cursor: pointer;

      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);

      transition: all 0.15s ease;
    }

    /* Hover */
    button:hover {
      background: white;
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    /* Click */
    button:active {
      transform: scale(0.92);
    }

    /* Operators */
    td:nth-child(4) button {
      background: #ff9f43;
      color: white;
    }

    td:nth-child(4) button:hover {
      background: #ff8c20;
    }

    /* AC */
    #clearall {
      background: #ff5c5c;
      color: white;
    }

    #clearall:hover {
      background: #ff3b3b;
    }

    /* Equals */
    tr:last-child td:last-child button {
      background: #2ed573;
      color: white;
    }

    tr:last-child td:last-child button:hover {
      background: #20bf6b;
    }

    /* Mobile */
    @media (max-width: 400px) {
      #cal {
        width: 95%;
      }

      #calculator {
        width: 90%;
      }
    }
  </style>
  <body>
    <div id="cal">
      <input
        type="text"
        id="calculator"
        placeholder="Let's Solve Your Problem"
      />
      <table>
        <tr>
          <td><button onclick="clearall()" id="clearall">AC</button></td>
          <td><button onclick="parentheses()">()</button></td>
          <td><button onclick="operator('%')">%</button></td>
          <td><button onclick="operator('/')">/</button></td>
        </tr>

        <tr>
          <td><button onclick="pressnumber('7')">7</button></td>
          <td><button onclick="pressnumber('8')">8</button></td>
          <td><button onclick="pressnumber('9')">9</button></td>
          <td><button onclick="operator('*')">*</button></td>
        </tr>

        <tr>
          <td><button onclick="pressnumber('4')">4</button></td>
          <td><button onclick="pressnumber('5')">5</button></td>
          <td><button onclick="pressnumber('6')">6</button></td>
          <td><button onclick="operator('-')">-</button></td>
        </tr>

        <tr>
          <td><button onclick="pressnumber('1')">1</button></td>
          <td><button onclick="pressnumber('2')">2</button></td>
          <td><button onclick="pressnumber('3')">3</button></td>
          <td><button onclick="operator('+')">+</button></td>
        </tr>

        <tr>
          <td><button onclick="pressnumber('0')">0</button></td>
          <td><button onclick="operator('.')">.</button></td>
          <td><button onclick="clear()">C</button></td>
          <td><button onclick="calculateall()">=</button></td>
        </tr>
      </table>
    </div>

    <script>
      // let calculator=document.querySelector("#calculator");

      function operator(oper) {
        let calculator = document.querySelector("#calculator");
        calculator.value += oper;
      }

      function pressnumber(num) {
        let calculator = document.querySelector("#calculator");
        calculator.value += num;
      }

      function clearall() {
        let calculator = document.querySelector("#calculator");
        calculator.value = "";
      }

      function clear() {
        let calculator = document.querySelector("#calculator");
        calculator.value = calculator.value.slice(0, -1);
      }

      function calculateall() {
        let calculator = document.querySelector("#calculator");
        try {
          calculator.value = eval(calculator.value);
        } catch (error) {
          calculator.value = error;
        }
      }

      let brackit = true;

      function parentheses() {
        if (brackit) {
          calculator.value += "(";
          brackit = false;
        } else {
          calculator.value += ")";
          brackit = true;
        }
      }
    </script>
  </body>
</html>
